name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: server and asset checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile the Python
        run: python -m compileall -q server scripts
      - name: Run the self-test
        run: python scripts/selftest.py
      - name: Icons are reproducible from the generator
        run: |
          python scripts/make-icons.py
          git diff --exit-code -- web/icons

  browser:
    name: browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run the smoke test
        run: node scripts/browser/smoke.mjs
